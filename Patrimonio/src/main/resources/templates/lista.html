
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LISTA DE PATRIMÔNIO</title>
</head>

<body>

<h2>CONTROLE DE PATRIMÔNIO</h2>

<a th:href="@{/patrimonios/novo}">Cadastro novo</a>

<table border="1">

    <thead>
    <tr>
        <th>ID</th>
        <th>Nr PATRIMÔNIO</th>
        <th>DESCRIÇÃO</th>
        <th>LOCAL</th>
        <th>AÇÕES</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="item : ${listarPatrimonios}">

        <td th:text="${item.id}"></td>

        <td th:text="${item.nrPatrimonio}"></td>

        <td th:text="${item.descricao}"></td>

        <td th:text="${item.local}"></td>

        <td>

            <a th:href="@{/patrimonios/editar/{id}(id=${item.id})}">
                Editar
            </a>

            <a th:href="@{/patrimonios/excluir/{id}(id=${item.id})}"
               onclick="return confirm('Deseja excluir esse patrimônio?')">
                Excluir
            </a>

        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
