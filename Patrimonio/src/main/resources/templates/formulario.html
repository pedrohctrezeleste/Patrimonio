
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FORMULÁRIO DE PATRIMÔNIO</title>

</head>

<body>

<h2>Cadastro / Edição de Patrimônio</h2>

<form th:action="@{/patrimonios/salvar}"
      th:object="${patrimonio}"
      method="post">

    <label>Número do Patrimônio</label>
    <input type="text"
           th:field="*{nrPatrimonio}"
           required>

    <br><br>

    <label>Descrição</label>
    <input type="text"
           th:field="*{descricao}"
           required>

    <br><br>

    <label>Local</label>
    <input type="text"
           th:field="*{local}"
           required>

    <br><br>

    <button type="submit">Salvar</button>

    <a th:href="@{/patrimonios}">Cancelar</a>

</form>

</body>
</html>
