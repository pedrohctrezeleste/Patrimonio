spring.application.name=Patrimonio

#CONFIGURA SUPORTE

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

#CONFIGURA BANCO

spring.datasource.url=jdbc:mysql://localhost:3380/patrimonio_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=""
spring.datasource.driver-class_name=com.mysql.cj.jdbc.Driver

#CONFIGURA JPA

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect